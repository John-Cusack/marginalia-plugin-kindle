name: kindle
version: 0.2.0
author: "MarginaliaAI"
description: "Kindle Cloud Reader scraper — extracts book text via Playwright and ingests it into the corpus."

requires:
  core_api: ">=0.2.0,<1.0.0"
  pip:
    - "playwright>=1.40"
    - "pytesseract>=0.3.10"
    - "pillow>=10.0"
  setup_commands:
    - "playwright install chromium"

permissions:
  network: egress
  network_allowlist: ["read.amazon.com", "amazon.com"]
  subprocess: true
  filesystem: read_write_plugin_data
  ingest: true

provides:
  document_types:
    - id: kindle_book
      default_chunker: prose_window

  mcp_tools:
    - id: kindle.scrape_book
      entry: kindle.tools.scrape_book:handler
      description: "Scrape full text of a Kindle book from Cloud Reader by ASIN, save to disk."
    - id: kindle.ingest_book
      entry: kindle.tools.ingest_book:handler
      description: "Scrape (if needed) and ingest a Kindle book into the corpus by ASIN. Idempotent."
    - id: kindle.check_book
      entry: kindle.tools.check_book:handler
      description: "Check whether a Kindle book is already on disk and/or ingested into the corpus."
    - id: kindle.list_books
      entry: kindle.tools.list_books:handler
      description: "List Kindle books known to the plugin: locally scraped texts and corpus-ingested documents."
